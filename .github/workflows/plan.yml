name: plan
 
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"
 
permissions:
  id-token: write        # required to request the OIDC token
  contents: read
  pull-requests: write   # so it can comment the plan on the PR
 
jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      # NEW: tag of the image that already exists in ECR (set under Settings > Variables)
      IMAGE_TAG: ${{ vars.IMAGE_TAG }}
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
 
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
 
      - run: terraform init
      - run: terraform fmt -check
      - run: terraform validate
 
      # -lock=false because the plan role is read-only and cannot
      # write a lock row. Safe here: a plan changes nothing.
      - run: |
          # NEW: fail early if the IMAGE_TAG variable is missing
          : "${IMAGE_TAG:?Set the IMAGE_TAG repository variable to a tag that exists in ECR}"
          # OLD (commented out): tagged with the commit SHA
          # terraform plan -no-color -lock=false \
          #   -var-file=ci.tfvars \
          #   -var="image_tag=${{ github.sha }}"
          # NEW: use the existing ECR tag
          terraform plan -no-color -lock=false \
            -var-file=ci.tfvars \
            -var="image_tag=${IMAGE_TAG}"